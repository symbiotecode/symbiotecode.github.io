# -----------------------------------------------------------------------------
# Core Settings
# -----------------------------------------------------------------------------
title: "SymbioteCode's Blog"
description: "A space where I write about code, and talk about video games."
author: "SymbioteCode"
theme: jekyll-theme-cayman

# -----------------------------------------------------------------------------
# URL & Routing Structure
# -----------------------------------------------------------------------------
url: "symbiotecode.xyz" # Main domain (NO trailing slash)
baseurl: "/blog"                      # Serves the site from /blog subdirectory
permalink: /:title/                    # Strips dates and .html for ultra-short URLs

# -----------------------------------------------------------------------------
# Social Profiles (For SEO Cards & Templates)
# -----------------------------------------------------------------------------
github_username: "symbiotecode"
bluesky_username: "symbiotecode.xyz"

# -----------------------------------------------------------------------------
# Built-In GitHub Pages Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-seo-tag    # Generates meta tags for Google and Bluesky preview cards
  - jekyll-sitemap    # Dynamically generates a sitemap.xml for web crawlers

